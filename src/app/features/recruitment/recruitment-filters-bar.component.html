<div class="filters-bar">
  <div class="filters-row">
    <app-chip-toggle-group
      label="Tipo de vaga"
      [options]="tipoOptions"
      [selected]="filters().tipos"
      (selectionChange)="onTipoChange($event)"
    />
    <app-chip-toggle-group
      label="Status"
      [options]="statusOptions"
      [selected]="filters().status"
      (selectionChange)="onStatusChange($event)"
    />
  </div>

  <div class="filters-row">
    <app-multi-select
      label="Cargo"
      [options]="availableCargos()"
      [selected]="filters().cargos"
      (selectionChange)="onCargoChange($event)"
    />
    <app-multi-select
      label="Setor"
      [options]="availableSetores()"
      [selected]="filters().setores"
      (selectionChange)="onSetorChange($event)"
    />
    <app-date-range-filter
      label="Período de recebimento"
      [range]="filters().recebimentoRange"
      [min]="recebimentoBounds()?.[0] ?? null"
      [max]="recebimentoBounds()?.[1] ?? null"
      (rangeChange)="onRecebimentoRangeChange($event)"
    />

    <div class="filters-meta">
      <span class="result-count">{{ resultCount().length | number }} vaga(s) no filtro</span>
      @if (hasActiveFilters()) {
        <button type="button" class="reset-btn" (click)="reset()">Limpar filtros</button>
      }
    </div>
  </div>
</div>
