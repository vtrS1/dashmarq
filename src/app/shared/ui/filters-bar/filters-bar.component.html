<div class="filters-bar">
  <div class="filters-row">
    <app-chip-toggle-group
      label="Faixa etária"
      [options]="ageGroupOptions"
      [selected]="filters().ageGroups"
      (selectionChange)="onAgeGroupChange($event)"
    />
    <app-chip-toggle-group
      label="Motivo de desligamento"
      [options]="reasonOptions"
      [selected]="filters().reasons"
      (selectionChange)="onReasonChange($event)"
    />
  </div>

  <div class="filters-row">
    <app-multi-select
      label="Função"
      [options]="availableRoles()"
      [selected]="filters().roles"
      (selectionChange)="onRoleChange($event)"
    />
    <app-multi-select
      label="Unidade / Seção"
      [options]="availableUnits()"
      [selected]="filters().units"
      (selectionChange)="onUnitChange($event)"
    />
    <app-date-range-filter
      label="Período de desligamento"
      [range]="filters().dismissalDateRange"
      [min]="dismissalDateBounds()?.[0] ?? null"
      [max]="dismissalDateBounds()?.[1] ?? null"
      (rangeChange)="onDismissalDateRangeChange($event)"
    />

    <div class="filters-meta">
      <span class="result-count">{{ resultCount().length | number }} colaboradores no filtro</span>
      @if (hasActiveFilters()) {
        <button type="button" class="reset-btn" (click)="reset()">Limpar filtros</button>
      }
    </div>
  </div>
</div>
